name: Neovim checkhealth
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
    - main
    paths: &paths
      - 'lua/**'
      - 'plugin/**'
      - 'spec/**'
      - '.github/workflows/checkhealth.yml'
  push:
    branches:
      - main
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkhealth:
    strategy:
      fail-fast: false
      matrix:
        # Every check except Neovim's core one, listed per version since
        # naming a missing check is an error.
        include:
          # 0.10: the core check is `nvim`; providers are separate checks.
          - os: ubuntu-latest
            neovim: v0.10.0
            checks: "treemotion provider.* vim.lsp vim.treesitter"
            core_checks: "nvim"

          # 0.11+: the core check is `vim.health`, with one `vim.provider`.
          - os: ubuntu-latest
            neovim: stable
            checks: "treemotion vim.deprecated vim.lsp vim.pack vim.provider vim.treesitter"
            core_checks: "vim.health"
          - os: ubuntu-latest
            neovim: nightly
            checks: "treemotion vim.deprecated vim.lsp vim.pack vim.provider vim.treesitter"
            core_checks: "vim.health"
          - os: macos-latest
            neovim: stable
            checks: "treemotion vim.deprecated vim.lsp vim.pack vim.provider vim.treesitter"
            core_checks: "vim.health"
          - os: windows-latest
            neovim: stable
            checks: "treemotion vim.deprecated vim.lsp vim.pack vim.provider vim.treesitter"
            core_checks: "vim.health"

    runs-on: ${{ matrix.os }}
    name: "OS: ${{ matrix.os }} - Neovim: ${{ matrix.neovim }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      # Inlined from ColinKennedy/nvim-checkhealth-gh-action v1.1.1: that action
      # calls knicknic/os-specific-run by tag, which "pin actions to a full
      # commit SHA" rejects. Its runner script is fetched at the pinned commit.
      - name: Fetch the :checkhealth runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ColinKennedy/nvim-checkhealth-gh-action
          ref: 9a3c87dc12f99a94407d02756d55b4e510fc436f
          path: .dependencies/nvim-checkhealth
          persist-credentials: false

      - name: Run :checkhealth
        shell: bash
        env:
          # Avoids `infocmp: environment variable TERM not set` on Neovim nightly.
          TERM: xterm-256color
          CHECKS: ${{ matrix.checks }}
        run: nvim -u spec/checkhealth_init.lua --headless -l .dependencies/nvim-checkhealth/main.lua "$CHECKS" error

      # Informational: on nightly the core check always reports a graphics
      # protocol error on a headless runner.
      - name: Run :checkhealth (Neovim core - informational only)
        continue-on-error: true
        shell: bash
        env:
          TERM: xterm-256color
          CHECKS: ${{ matrix.core_checks }}
        run: nvim -u spec/checkhealth_init.lua --headless -l .dependencies/nvim-checkhealth/main.lua "$CHECKS" error
