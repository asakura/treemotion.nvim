name: Lints

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
    - main
    paths: &paths
      - 'lua/**'
      - 'plugin/**'
      - 'scripts/**'
      - 'spec/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.luacov'
      - '.luacheckrc'
      - '.stylua.toml'
      - 'README.md'
      - 'markdown/**'
      - '.github/workflows/lints.yml'
  push:
    branches:
      - main
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: asakura/actions/.github/actions/setup-nix@32fd43107b80ca9d29152b5d32d4bb61e8723527 # v1.0.0
        with:
          github-token: ${{ github.token }}

      - name: Cache Nix Store
        # pin-comment: no vX.Y.Z tag upstream
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Run llscheck
        run: nix build .#checks.x86_64-linux.llscheck -L

      - name: Run Luacheck
        run: nix build .#checks.x86_64-linux.luacheck -L

      - name: Run StyLua
        run: nix build .#checks.x86_64-linux.stylua -L

      - name: Run nixfmt
        run: nix build .#checks.x86_64-linux.nixfmt -L

      - name: Run mdformat
        run: nix build .#checks.x86_64-linux.mdformat -L

  coverage:
    name: LuaCov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: asakura/actions/.github/actions/setup-nix@32fd43107b80ca9d29152b5d32d4bb61e8723527 # v1.0.0
        with:
          github-token: ${{ github.token }}

      - name: Cache Nix Store
        # pin-comment: no vX.Y.Z tag upstream
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Run LuaCov
        run: nix run .#coverage-html

      - name: Enforce Minimum Coverage
        run: nix run .#coverage-threshold
