name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'lua/**'
      - 'markdown/**'
      - 'README.md'
      - '.github/workflows/documentation.yml'

jobs:
  check_documentation_branch:
    name: Check For A Documentation Branch
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check_branch.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check If A Valid Documentation Branch Exists
        id: check_branch
        run: |
          if git ls-remote --exit-code origin refs/heads/gh-pages; then
            echo "The branch exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "The branch does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  html_documentation:
    needs: check_documentation_branch
    if: needs.check_documentation_branch.outputs.exists == 'true'
    name: HTML Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install emmylua_doc_cli From crates.io
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: emmylua_doc_cli

      - name: Generate Mkdocs Files With emmylua_doc_cli
        run: emmylua_doc_cli --input lua/ --output markdown/generated --mixin markdown/manual

      - name: Deploy To GitHub Pages
        # pin-comment: no vX.Y.Z tag upstream
        uses: mhausenblas/mkdocs-deploy-gh-pages@d77dd03172e96abbcdb081d8c948224762033653 # 1.26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_FILE: markdown/generated/mkdocs.yml


  vim_documentation:
    name: Vim Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: asakura/actions/.github/actions/setup-nix@32fd43107b80ca9d29152b5d32d4bb61e8723527 # v1.0.0
        with:
          github-token: ${{ github.token }}

      - name: Cache Nix Store
        # pin-comment: no vX.Y.Z tag upstream
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Create API Documentation
        run: nix run .#api-documentation

      - name: Create User Documentation
        run: nix run .#user-documentation

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: docs/vimdoc
          delete-branch: true
          commit-message: "docs(vimdoc): auto-generate user / API documentation + vimtags"
          title: "docs(vimdoc): auto-generate user / API documentation + vimtags"
          body: Regenerated by the Documentation workflow.
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
