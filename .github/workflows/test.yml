name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
    - main
    paths: &paths
      - 'lua/**'
      - 'plugin/**'
      - 'spec/**'
      - 'template.rockspec'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/test.yml'
  push:
    branches:
      - main
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "v0.11.0"
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "v0.12.0"
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "stable"
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "nightly"
        - os: "macos-latest"
          luaVersion: "luajit-openresty"
          neovim: "stable"
        - os: "windows-latest"
          toolchain: "msvc"
          luaVersion: "5.1"
          neovim: "stable"

    runs-on: ${{ matrix.os }}
    name: "OS: ${{ matrix.os }} - Neovim: ${{ matrix.neovim }} - Lua: ${{ matrix.luaVersion }}"

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup MSVC
      # the 'luarocks/gh-actions-lua' step requires msvc to build PUC-Rio Lua
      # versions on Windows (LuaJIT will be build using MinGW/gcc).
      if: ${{ matrix.toolchain == 'msvc' }}
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Install Neovim
      uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
      with:
        neovim: true
        version: ${{ matrix.neovim }}

    - name: Install Lua
      uses: luarocks/gh-actions-lua@56eba09993704b908cc3c7c2753e630d18cb9696 # v14 # pin-comment: no vX.Y.Z tag upstream
      with:
        luaVersion: "${{ matrix.luaVersion }}"

    - name: Install LuaRocks
      uses: luarocks/gh-actions-luarocks@95d2308a0aff36ad31ebadca493ed14853399842 # v7 # pin-comment: no vX.Y.Z tag upstream

    - name: Cache LuaRocks
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.luarocks
          ~/.cache/luarocks
        key: luarocks-${{ runner.os }}-${{ matrix.luaVersion }}-${{ hashFiles('template.rockspec') }}
        restore-keys: |
          luarocks-${{ runner.os }}-${{ matrix.luaVersion }}-

    - name: Print Versions
      run: |
        luarocks --version

    # XXX: We need this hack until a better solution is available.
    # Reference: https://github.com/nvim-neorocks/luarocks-tag-release/issues/435
    # Inlined from ColinKennedy/luarocks-rockspec-expander v1.0.1: that action
    # calls knicknic/os-specific-run, actions/checkout and luarocks/gh-actions-lua
    # by tag, which "pin actions to a full commit SHA" rejects. Its Lua script and
    # luarocks-tag-release are fetched at pinned commits. luarocks-tag-release is
    # pinned to the last commit before it dropped `ltr.rockspec` (Lux rewrite,
    # 2026-10-16), which the expander still requires. The "install LuaJIT if
    # missing" fallback is dropped: "Install Lua" above always provides one.

    - name: Fetch luarocks-tag-release
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: nvim-neorocks/luarocks-tag-release
        ref: b269146602489cd981a911e97ef34b8d937e8427
        path: .dependencies/luarocks-tag-release
        persist-credentials: false

    - name: Fetch the rockspec expander
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ColinKennedy/luarocks-rockspec-expander
        ref: 54d46417390ee23b02310b4c69b25e395c489f32
        path: .dependencies/rockspec-expander
        persist-credentials: false

    - name: Expand The Template Rockspec
      shell: bash
      env:
        LUA_PATH: ".dependencies/luarocks-tag-release/lua/?.lua;;"
      run: |
        if command -v lua >/dev/null 2>&1; then lua_exe=lua; else lua_exe=luajit; fi
        "$lua_exe" .dependencies/rockspec-expander/main.lua template.rockspec treemotion.nvim-scm-1.rockspec true

    - name: Build Test Dependencies
      run: |
        luarocks test treemotion.nvim-scm-1.rockspec --prepare

    # `--prepare` installs only busted, not `mega.cmdparse`/`mega.logging`.
    - name: Install Runtime Dependencies
      run: |
        luarocks make --only-deps treemotion.nvim-scm-1.rockspec

    # The plugin needs `vim.*`, so busted runs under `nvim -l`. Backslashes
    # in Windows paths would be escapes in the Lua string, so use `/`.
    - name: Write Busted Config
      shell: bash
      run: |
        lpath="lua/?.lua;lua/?/init.lua;spec/?.lua;$(luarocks path --lr-path | tr '\\' '/')"
        cat > .busted <<EOF
        return {
          _all = {
            coverage = false,
            lpath = "$lpath",
            lua = "nvim -u NONE -U NONE -N -i NONE -l",
          },
          default = {
            helper = "./spec/minimal_init.lua",
            verbose = true,
          },
        }
        EOF

    - name: Test
      run: |
        luarocks test --test-type busted

  test-nix:
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: "unstable"
          nixpkgs: "github:NixOS/nixpkgs/nixos-unstable"
        - label: "stable"
          nixpkgs: "github:NixOS/nixpkgs/nixos-26.05"

    runs-on: ubuntu-latest
    name: "OS: NixOS - nixpkgs: ${{ matrix.label }}"

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Nix
      uses: asakura/actions/.github/actions/setup-nix@32fd43107b80ca9d29152b5d32d4bb61e8723527 # v1.0.0
      with:
        github-token: ${{ github.token }}

    - name: Cache Nix Store
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15 # pin-comment: no vX.Y.Z tag upstream

    # Building the packaged plugin runs the busted suite as its
    # `checkPhase`, so a successful build here is the test run.
    - name: Build (runs tests)
      run: nix build .#treemotion-nvim -L --override-input nixpkgs "${{ matrix.nixpkgs }}"
