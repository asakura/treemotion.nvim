name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
    - main
    paths: &paths
      - 'lua/**'
      - 'plugin/**'
      - 'spec/**'
      - 'template.rockspec'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/test.yml'
  push:
    branches:
      - main
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "v0.11.0"
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "v0.12.0"
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "stable"
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "nightly"
        - os: "macos-latest"
          luaVersion: "luajit-openresty"
          neovim: "stable"
        - os: "windows-latest"
          toolchain: "msvc"
          luaVersion: "5.1"
          neovim: "stable"

    runs-on: ${{ matrix.os }}
    name: "OS: ${{ matrix.os }} - Neovim: ${{ matrix.neovim }} - Lua: ${{ matrix.luaVersion }}"

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup MSVC
      # the 'luarocks/gh-actions-lua' step requires msvc to build PUC-Rio Lua
      # versions on Windows (LuaJIT will be build using MinGW/gcc).
      if: ${{ matrix.toolchain == 'msvc' }}
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Neovim
      uses: rhysd/action-setup-vim@v1
      with:
        neovim: true
        version: ${{ matrix.neovim }}

    - name: Install Lua
      uses: luarocks/gh-actions-lua@v11
      with:
        luaVersion: "${{ matrix.luaVersion }}"

    - name: Install LuaRocks
      uses: luarocks/gh-actions-luarocks@v7

    - name: Cache LuaRocks
      uses: actions/cache@v6
      with:
        path: |
          ~/.luarocks
          ~/.cache/luarocks
        key: luarocks-${{ runner.os }}-${{ matrix.luaVersion }}-${{ hashFiles('template.rockspec') }}
        restore-keys: |
          luarocks-${{ runner.os }}-${{ matrix.luaVersion }}-

    - name: Print Versions
      run: |
        luarocks --version

    # XXX: We need this hack until a better solution is available.
    # Reference: https://github.com/nvim-neorocks/luarocks-tag-release/issues/435
    - name: Expand The Template Rockspec
      uses: ColinKennedy/luarocks-rockspec-expander@v1.0.1
      with:
        input: template.rockspec
        output: treemotion.nvim-scm-1.rockspec
        delete_input_after: true

    - name: Build Test Dependencies
      run: |
        luarocks test treemotion.nvim-scm-1.rockspec --prepare

    # `--prepare` only installs `test_dependencies` (busted itself). Without
    # this, `treemotion._core.configuration` and friends can never be
    # `require()`-d because `mega.cmdparse`/`mega.logging` (this rockspec's
    # actual `dependencies`) are never installed anywhere on the Lua path.
    - name: Install Runtime Dependencies
      run: |
        luarocks make --only-deps treemotion.nvim-scm-1.rockspec

    # `treemotion.nvim` calls `vim.*` at require-time (e.g.
    # `configuration.lua`'s `vim.g`, `mega.logging`'s own `vim.*` calls), so
    # plain `lua`/`luajit` can never load it -- busted must run under `nvim -l`
    # the same way `nix run .#test` does locally (see `flake.nix`'s
    # `bustedConfig`). `busted` reads `.busted` from the working directory by
    # default, so writing it here is enough; the `Test` step below needs no
    # changes.
    #
    # On Windows, `luarocks path --lr-path` returns backslash-separated
    # paths (e.g. `C:\Users\...\?.lua`); embedded verbatim into the Lua
    # string literal below, those backslashes are parsed as escape
    # sequences and `.busted` fails to load. Forward slashes work fine as
    # path separators on Windows too, so normalize before embedding.
    - name: Write Busted Config
      shell: bash
      run: |
        lpath="lua/?.lua;lua/?/init.lua;spec/?.lua;$(luarocks path --lr-path | tr '\\' '/')"
        cat > .busted <<EOF
        return {
          _all = {
            coverage = false,
            lpath = "$lpath",
            lua = "nvim -u NONE -U NONE -N -i NONE -l",
          },
          default = {
            helper = "./spec/minimal_init.lua",
            verbose = true,
          },
        }
        EOF

    - name: Test
      run: |
        luarocks test --test-type busted

  test-nix:
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: "unstable"
          nixpkgs: "github:NixOS/nixpkgs/nixos-unstable"
        - label: "stable"
          nixpkgs: "github:NixOS/nixpkgs/nixos-26.05"

    runs-on: ubuntu-latest
    name: "OS: NixOS - nixpkgs: ${{ matrix.label }}"

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v22

    - name: Cache Nix Store
      uses: DeterminateSystems/magic-nix-cache-action@v14

    # Building the packaged plugin runs the busted suite as its
    # `checkPhase`, so a successful build here is the test run.
    - name: Build (runs tests)
      run: nix build .#treemotion-nvim -L --override-input nixpkgs "${{ matrix.nixpkgs }}"
