name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
    - main
    paths: &paths
      - 'lua/**'
      - 'plugin/**'
      - 'spec/**'
      - 'template.rockspec'
      - '.github/workflows/test.yml'
  push:
    branches:
      - main
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "v0.11.0"
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "v0.12.0"
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "stable"
        - os: "ubuntu-latest"
          luaVersion: "luajit-openresty"
          neovim: "nightly"
        - os: "macos-latest"
          luaVersion: "luajit-openresty"
          neovim: "stable"
        - os: "windows-latest"
          toolchain: "msvc"
          luaVersion: "5.1"
          neovim: "stable"

    runs-on: ${{ matrix.os }}
    name: "OS: ${{ matrix.os }} - Neovim: ${{ matrix.neovim }} - Lua: ${{ matrix.luaVersion }}"

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup MSVC
      # the 'luarocks/gh-actions-lua' step requires msvc to build PUC-Rio Lua
      # versions on Windows (LuaJIT will be build using MinGW/gcc).
      if: ${{ matrix.toolchain == 'msvc' }}
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Neovim
      uses: rhysd/action-setup-vim@v1
      with:
        neovim: true
        version: ${{ matrix.neovim }}

    - name: Install Lua
      uses: luarocks/gh-actions-lua@v11
      with:
        luaVersion: "${{ matrix.luaVersion }}"

    - name: Install LuaRocks
      uses: https://github.com/luarocks/gh-actions-luarocks@7

    - name: Cache LuaRocks
      uses: actions/cache@v4
      with:
        path: |
          ~/.luarocks
          ~/.cache/luarocks
        key: luarocks-${{ runner.os }}-${{ matrix.luaVersion }}-${{ hashFiles('template.rockspec') }}
        restore-keys: |
          luarocks-${{ runner.os }}-${{ matrix.luaVersion }}-

    - name: Print Versions
      run: |
        luarocks --version

    # XXX: We need this hack until a better solution is available.
    # Reference: https://github.com/nvim-neorocks/luarocks-tag-release/issues/435
    - name: Expand The Template Rockspec
      uses: ColinKennedy/luarocks-rockspec-expander@v1.0.1
      with:
        input: template.rockspec
        output: treemotion.nvim-scm-1.rockspec
        delete_input_after: true

    - name: Build Test Dependencies
      run: |
        luarocks test treemotion.nvim-scm-1.rockspec --prepare

    - name: Test
      run: |
        luarocks test --test-type busted
