# Reference: https://github.com/crate-ci/committed#basic-usage
name: Commitlint

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    # release-please's own PR commit ("chore(main): release X.Y.Z") is
    # generated verbatim by googleapis/release-please-action and doesn't
    # follow this repo's capitalization convention; skip linting it.
    if: github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    name: Commitlint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run committed
        uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f # v1.1.11
