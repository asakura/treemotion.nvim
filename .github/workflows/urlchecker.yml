name: URLChecker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
    - main
    paths: &paths
      - 'doc/**'
      - 'lua/**'
      - 'plugin/**'
      - 'scripts/**'
      - 'spec/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - '.github/workflows/urlchecker.yml'
  push:
    branches:
      - main
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  urlchecker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache pip
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: pip-urlchecker

    - name: Install urlchecker
      run: |
        python -m pip install urlchecker

    - name: "Directory: doc"
      run: |
        urlchecker check \
          --branch main \
          --subfolder doc \
          --exclude-patterns "http://127.0.0.1:8000,https://host/path" \
          --no-print \
          --file-types .json,.lua,.md,.txt,.vim,.yml \
          --retry-count 3 \
          --timeout 20 \
          .

    - name: "Directory: lua"
      run: |
        urlchecker check \
          --branch main \
          --subfolder lua \
          --exclude-patterns "https://host/path" \
          --no-print \
          --file-types .json,.lua,.md,.txt,.vim,.yml \
          --retry-count 3 \
          --timeout 20 \
          .

    - name: "Directory: plugin"
      run: |
        urlchecker check \
          --branch main \
          --subfolder plugin \
          --no-print \
          --file-types .json,.lua,.md,.txt,.vim,.yml \
          --retry-count 3 \
          --timeout 20 \
          .

    - name: "Directory: scripts"
      run: |
        urlchecker check \
          --branch main \
          --subfolder scripts \
          --exclude-patterns "https://github.com/folke/lazy.nvim.git" \
          --no-print \
          --file-types .json,.lua,.md,.txt,.vim,.yml \
          --retry-count 3 \
          --timeout 20 \
          .

    - name: "Directory: spec"
      run: |
        urlchecker check \
          --branch main \
          --subfolder spec \
          --exclude-patterns "http://example.com/a/b-c,https://example.com/a/b" \
          --no-print \
          --file-types .json,.lua,.md,.txt,.vim,.yml \
          --retry-count 3 \
          --timeout 20 \
          .

    - name: "File: CHANGELOG.md"
      if: ${{ github.event.pull_request.head.ref == 'release-please--branches--main' }}
      run: |
        urlchecker check \
          --branch main \
          --subfolder . \
          --exclude-patterns "https://github.com/asakura/treemotion.nvim/compare/v" \
          --files CHANGELOG.md \
          --no-print \
          --file-types .json,.lua,.md,.txt,.vim,.yml \
          --retry-count 3 \
          --timeout 20 \
          .

    - name: "File: CHANGELOG.md"
      if: ${{ github.event.pull_request.head.ref != 'release-please--branches--main' }}
      run: |
        urlchecker check \
          --branch main \
          --subfolder . \
          --files CHANGELOG.md \
          --no-print \
          --retry-count 3 \
          --timeout 20 \
          .

    - name: "File: README.md"
      run: |
        urlchecker check \
          --branch main \
          --subfolder . \
          --exclude-patterns "http://127.0.0.1:8000,https://host/path" \
          --files README.md \
          --no-print \
          --retry-count 3 \
          --timeout 20 \
          .
